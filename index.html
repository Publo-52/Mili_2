<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY DEAR MILI❤️</title>
    <link rel='stylesheet'
        href='https://fonts.googleapis.com/css2?family=Short+Stack&amp;family=Homemade+Apple&amp;display=swap'>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="paper heart"
        style="background-color: rgb(255, 0, 0); color: rgb(255, 255, 255); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 2.5rem; border-radius: 50%; width: 200px; height: 200px;">
        MILI
    </div>

    <div class="paper image">
        <p> and I am in </p>
        <p>Love with You 😍 </p>
        <img src="Images/img4.jpeg" />
    </div>

    <div class="paper image">
        <p>I have fallen</p>
        <p>under your spell ❤️</p>
        <img src="Images/img6.jpeg" />
    </div>

    <div class="paper image">
        <p>Your eyes hold my heart, my peace</p>
        <p>my forever, my everything ❤️ </p>
        <img src="Images/img11.jpeg" />
    </div>

    <div class="paper red">
        <p class="p1"> and My Favorite</p>
        <p class="p2">Person 😍</p>
    </div>

    <div class="paper">
        <p class="p1">You are Cute </p>
        <p class="p1">Amazing <span style="color: red !important;">❤️</span></p>
    </div>

    <div class="paper">
        <p class="p1">Drag the papers to move!</p>
    </div>
    <script src="script.js"></script>

    <!-- Music Player -->
    <audio id="bgMusic" loop src="Audio/song.mpeg"></audio>

    <button id="musicBtn" onclick="toggleMusic()" title="Play Music">🎵</button>

    <script>
        const music = document.getElementById('bgMusic');
        const btn = document.getElementById('musicBtn');
        let playing = false;
        let unlocked = false;

        // Unlock + autoplay on FIRST touch anywhere on mobile
        function unlockAudio() {
            if (unlocked) return;
            unlocked = true;
            music.play().then(() => {
                playing = true;
                btn.textContent = '🎵';
            }).catch(() => { });
            document.removeEventListener('touchstart', unlockAudio);
            document.removeEventListener('click', unlockAudio);
        }

        document.addEventListener('touchstart', unlockAudio);
        document.addEventListener('click', unlockAudio);

        function toggleMusic() {
            if (playing) {
                music.pause();
                btn.textContent = '▶️';
            } else {
                music.play();
                btn.textContent = '🎵';
            }
            playing = !playing;
        }
    </script>
</body>

</html>
